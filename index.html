<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="Rc37V0yUOlOQ63_Xbh2ZBifWdLH-hwXKErQ3B6YWxwU" />
    <title>QR PRO LK | Cortex Prime</title>
    
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        /* මුළු පේජ් එකම පාලනය කරන හැටි */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: #0b0f19; /* Dark theme background */
        }

        /* Hugging Face ඇප් එක පෙන්වන Frame එක */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        /* Loading වෙද්දී පේන මැසේජ් එක */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.2rem;
            z-index: -1;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="loader">
        <p>Loading QR PRO LK...</p>
    </div>

    <iframe 
        src="https://cortexprime-qr-pro-lk.hf.space" 
        allow="camera; clipboard-read; clipboard-write"
    ></iframe>

</body>
</html>
